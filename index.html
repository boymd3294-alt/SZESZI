<!doctype html>
<html lang="hu">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <meta
        name="description"
        content="SZESZI – Szigeti Endre Technikum közösségi és tanulási platform"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <title>SZESZI</title>
</head>


<body>

<div id="app">


    <!-- =====================================================
         AUTHENTIKÁCIÓS FELÜLET
    ====================================================== -->

    <section
        id="authScreen"
        class="auth-screen"
        hidden
    >

        <div class="auth-container">

            <div class="auth-brand">

                <div class="auth-logo">
                    S
                </div>

                <h1>SZESZI</h1>

                <p>
                    Szigeti Endre Technikum
                </p>

            </div>


            <!-- LOGIN -->

            <div
                id="loginView"
                class="auth-card"
            >

                <div class="auth-header">

                    <h2>Bejelentkezés</h2>

                    <p>
                        Jelentkezz be a SZESZI-be.
                    </p>

                </div>


                <form id="loginForm">

                    <div class="form-group">

                        <label for="loginEmail">
                            E-mail cím
                        </label>

                        <input
                            id="loginEmail"
                            type="email"
                            autocomplete="email"
                            placeholder="pelda@email.hu"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="loginPassword">
                            Jelszó
                        </label>

                        <input
                            id="loginPassword"
                            type="password"
                            autocomplete="current-password"
                            placeholder="Jelszó"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="primary-btn full-width"
                    >
                        Bejelentkezés
                    </button>

                </form>


                <div class="auth-switch">

                    <span>
                        Még nincs fiókod?
                    </span>

                    <button
                        type="button"
                        class="text-btn"
                        id="showRegister"
                    >
                        Regisztráció
                    </button>

                </div>

            </div>


            <!-- REGISTER -->

            <div
                id="registerView"
                class="auth-card"
                hidden
            >

                <div class="auth-header">

                    <h2>Fiók létrehozása</h2>

                    <p>
                        Csatlakozz a SZESZI közösségéhez.
                    </p>

                </div>


                <form id="registerForm">

                    <div class="form-group">

                        <label for="registerName">
                            Teljes név
                        </label>

                        <input
                            id="registerName"
                            type="text"
                            autocomplete="name"
                            placeholder="Teljes neved"
                            required
                            maxlength="100"
                        >

                    </div>


                    <div class="form-group">

                        <label for="registerEmail">
                            E-mail cím
                        </label>

                        <input
                            id="registerEmail"
                            type="email"
                            autocomplete="email"
                            placeholder="pelda@email.hu"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="registerPassword">
                            Jelszó
                        </label>

                        <input
                            id="registerPassword"
                            type="password"
                            autocomplete="new-password"
                            placeholder="Legalább 6 karakter"
                            minlength="6"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="registerPasswordConfirm">
                            Jelszó újra
                        </label>

                        <input
                            id="registerPasswordConfirm"
                            type="password"
                            autocomplete="new-password"
                            placeholder="Jelszó újra"
                            minlength="6"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="registerClass">
                            Osztály
                        </label>

                        <input
                            id="registerClass"
                            type="text"
                            placeholder="Például: 10.A"
                            maxlength="30"
                        >

                    </div>


                    <div class="form-group">

                        <label for="registerSpecialization">
                            Szak / képzés
                        </label>

                        <input
                            id="registerSpecialization"
                            type="text"
                            placeholder="Szak vagy képzés"
                            maxlength="100"
                        >

                    </div>


                    <button
                        type="submit"
                        class="primary-btn full-width"
                    >
                        Regisztráció
                    </button>

                </form>


                <div class="auth-switch">

                    <span>
                        Már van fiókod?
                    </span>

                    <button
                        type="button"
                        class="text-btn"
                        id="showLogin"
                    >
                        Bejelentkezés
                    </button>

                </div>

            </div>

        </div>

    </section>



    <!-- =====================================================
         FŐ ALKALMAZÁS
    ====================================================== -->

    <section
        id="mainApp"
        hidden
    >


        <!-- =================================================
             TOPBAR
        ================================================== -->

        <header class="topbar">

            <button
                class="icon-btn mobile-only"
                id="menuBtn"
                type="button"
                aria-label="Menü"
            >
                ☰
            </button>


            <div class="brand">

                <span class="brand-mark">
                    S
                </span>

                <div>

                    <strong>
                        SZESZI
                    </strong>

                    <small>
                        Szigeti Endre Technikum
                    </small>

                </div>

            </div>


            <div class="top-search">

                <input
                    id="globalSearch"
                    type="search"
                    placeholder="Keresés a SZESZI-ben…"
                    autocomplete="off"
                >

            </div>


            <div class="top-actions">

                <button
                    class="icon-btn"
                    data-view="notifications"
                    type="button"
                    aria-label="Értesítések"
                >
                    🔔
                </button>


                <button
                    class="avatar small"
                    data-view="profile"
                    id="topAvatar"
                    type="button"
                    aria-label="Profil"
                >
                    ?
                </button>

            </div>

        </header>



        <!-- =================================================
             LAYOUT
        ================================================== -->

        <div class="layout">


            <!-- =================================================
                 SIDEBAR
            ================================================== -->

            <aside
                class="sidebar"
                id="sidebar"
            >

                <nav>

                    <button
                        class="nav-item active"
                        data-view="home"
                        type="button"
                    >
                        🏠
                        <span>
                            Kezdőlap
                        </span>
                    </button>


                    <button
                        class="nav-item"
                        data-view="questions"
                        type="button"
                    >
                        ❓
                        <span>
                            Kérdések
                        </span>
                    </button>


                    <button
                        class="nav-item"
                        data-view="messages"
                        type="button"
                    >
                        💬
                        <span>
                            Üzenetek
                        </span>
                    </button>


                    <button
                        class="nav-item"
                        data-view="groups"
                        type="button"
                    >
                        👥
                        <span>
                            Csoportok
                        </span>
                    </button>


                    <button
                        class="nav-item"
                        data-view="subjects"
                        type="button"
                    >
                        📚
                        <span>
                            Tantárgyak
                        </span>
                    </button>


                    <button
                        class="nav-item"
                        data-view="materials"
                        type="button"
                    >
                        📖
                        <span>
                            Tananyagok
                        </span>
                    </button>


                    <button
                        class="nav-item"
                        data-view="announcements"
                        type="button"
                    >
                        📢
                        <span>
                            Iskolai hírek
                        </span>
                    </button>


                    <button
                        class="nav-item"
                        data-view="saved"
                        type="button"
                    >
                        🔖
                        <span>
                            Mentések
                        </span>
                    </button>


                    <button
                        class="nav-item"
                        data-view="profile"
                        type="button"
                    >
                        👤
                        <span>
                            Profil
                        </span>
                    </button>


                    <button
                        class="nav-item"
                        data-view="admin"
                        id="adminNav"
                        type="button"
                        hidden
                    >
                        🛡️
                        <span>
                            Admin
                        </span>
                    </button>

                </nav>


                <div>

                    <button
                        class="nav-item"
                        data-view="settings"
                        type="button"
                    >
                        ⚙️
                        <span>
                            Beállítások
                        </span>
                    </button>


                    <div class="school-card">

                        <b>
                            SZESZI
                        </b>

                        <span>
                            Iskolai közösség
                        </span>

                    </div>

                </div>

            </aside>



            <!-- =================================================
                 CONTENT
            ================================================== -->

            <main class="content">

                <div id="page"></div>

            </main>

        </div>



        <!-- =================================================
             MOBILE NAV
        ================================================== -->

        <nav class="bottom-nav">

            <button
                data-view="home"
                type="button"
            >
                🏠
                <span>
                    Kezdőlap
                </span>
            </button>


            <button
                data-view="questions"
                type="button"
            >
                ❓
                <span>
                    Kérdések
                </span>
            </button>


            <button
                class="create-btn"
                id="mobileCreate"
                type="button"
                aria-label="Új tartalom"
            >
                ＋
            </button>


            <button
                data-view="messages"
                type="button"
            >
                💬
                <span>
                    Üzenetek
                </span>
            </button>


            <button
                data-view="profile"
                type="button"
            >
                👤
                <span>
                    Profil
                </span>
            </button>

        </nav>

    </section>

</div>



<!-- =========================================================
     MODAL
========================================================== -->

<div
    class="modal"
    id="modal"
    hidden
>

    <div
        class="modal-backdrop"
        data-close-modal
    ></div>


    <section class="modal-card">

        <button
            class="modal-close"
            data-close-modal
            type="button"
            aria-label="Bezárás"
        >
            ×
        </button>


        <div id="modalContent"></div>

    </section>

</div>



<!-- =========================================================
     TOAST
========================================================== -->

<div id="toast"></div>



<!-- =========================================================
     SCRIPTS
========================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script src="app.js"></script>


</body>

</html>
